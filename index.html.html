$('#pb').addEventListener('pointerdown',e=>{e.stopPropagation();pause()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')lane(-1);else if(k==='arrowright'||k==='d')lane(1);else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='arrowdown'||k==='s')slide();else if(k==='q')pPow();else if(k==='e')lPow();else if(k==='p'||k==='escape')G.state==='play'?pause():resume()});
function pause(){if(G.state==='play'){G.state='pause';show('pause')}}function resume(){if(G.state==='pause'){G.state='play';show('')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();save()}});
function renderShop(){$('#sw').textContent='MONEDAS '+D.wallet;$('#sl').innerHTML=UP.map(u=>{const l=D.up[u.k],mx=l>=u.max,c=cost(l);return'<div class="card"><div class="x"><b>'+u.n+'</b><br>'+u.d+'<br><span class="pips">'+'■'.repeat(l)+'□'.repeat(u.max-l)+'</span></div><button class="btn s" data-a="buy" data-k="'+u.k+'" '+(mx||D.wallet<c?'disabled':'')+'>'+(mx?'MAX':c)+'</button></div>'}).join('')}
let from='menu';
function share(){const t='Derroté al Joystick Definitivo con Nahuel (NO HANDS): '+Math.floor(G.dist)+' m y '+G.coins+' monedas. ¿Me superás?';if(navigator.share)navigator.share({text:t,url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t+' '+location.href).then(()=>$('#shm').textContent='Texto copiado: pegalo en tu chat').catch(()=>$('#shm').textContent=t);else $('#shm').textContent=t}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='play'){reset();show('');$('#hud').classList.add('on');tone(400,.2,'square',.05,900)}
 else if(a==='menu')toMenu();else if(a==='resume')resume();
 else if(a==='snd'){D.snd=D.snd?0:1;save();menuInfo()}else if(a==='vib'){D.vib=D.vib?0:1;save();menuInfo();vib(40)}
 else if(a==='shop'){from=G.state;renderShop();show('shop')}
 else if(a==='back'){from==='over'?show('over'):toMenu()}
 else if(a==='share')share();
 else if(a==='buy'){const k=b.dataset.k,l=D.up[k];if(l<4&&D.wallet>=cost(l)){D.wallet-=cost(l);D.up[k]++;save();tone(700,.15,'square',.05,1200);renderShop()}}});
toMenu();pandi.position.set(-1.7,0,1.8);lira.position.set(1.7,0,1.8);requestAnimationFrame(frame);
</script></body></html>
